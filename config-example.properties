input.dir=/data/jsonl
input.suffix=.jsonl.gz
json.arrayFieldPath=records
json.objectNameField=objectName

action.skipExistingTarget=false
action.targetKeyPrefix=

# 并发读取 jsonl.gz 文件的线程数。几十个文件可先试 4~8
reader.threads=4
# 并发传输线程数。建议先从 32/64 起压测，再按源/目标 MinIO、带宽、CPU 调整
transfer.threads=32
# 生产者（解析 jsonl.gz）到消费者（MinIO 传输）的队列容量
transfer.queueCapacity=5000
# 单个对象传输失败后的最大重试次数
transfer.maxRetries=3
# 失败重试退避时间（毫秒）
transfer.retryBackoffMillis=1000
# 进度日志打印间隔（秒）
progress.logIntervalSeconds=30

source.endpoint=http://127.0.0.1:9000
source.accessKey=minioadmin
source.secretKey=minioadmin
source.bucket=source-bucket
source.region=

target.endpoint=http://127.0.0.1:9001
target.accessKey=minioadmin
target.secretKey=minioadmin
target.bucket=target-bucket
target.region=
